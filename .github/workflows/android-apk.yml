name: FoodOrder Android - APK firmado

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Ionic/FoodOrder/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: Ionic/FoodOrder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Ionic/FoodOrder/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Instalar dependencias nativas y web
        run: npm ci --no-audit --no-fund

      - name: Definir identificador del bundle web
        run: |
          printf "export const OTA_BUILD_SHA = '%s';\nexport const OTA_NATIVE_CHANNEL = 'capacitor8-v1';\n" "$GITHUB_SHA" > src/app/core/ota-build.ts

      - name: Construir Angular de producción
        run: npm run build -- --configuration production

      - name: Generar Android con Capacitor
        run: |
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew

      - name: Aumentar versión Android
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle

      - name: Comprobar si hay secretos de firma
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" && -n "$STORE_PASS" && -n "$ALIAS" && -n "$KEY_PASS" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'No hay firma release: configurar los cuatro secretos ANDROID_* indicados en la guía.'
          fi

      - name: Compilar y firmar APK release
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/foodorder-release.jks"
          cd android
          ./gradlew --no-daemon assembleRelease \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/foodorder-release.jks" \
            "-Pandroid.injected.signing.store.password=$STORE_PASS" \
            "-Pandroid.injected.signing.key.alias=$ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASS"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/FoodOrder-release-firmado.apk"

      - name: Publicar APK release firmado
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FoodOrder-APK-Firmado
          path: ${{ runner.temp }}/FoodOrder-release-firmado.apk
          if-no-files-found: error
          retention-days: 30

      - name: Compilar APK debug mientras no existan secretos
        if: steps.signing.outputs.enabled != 'true'
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Publicar APK debug
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FoodOrder-APK-Debug-Sin-Firma-Estable
          path: Ionic/FoodOrder/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
